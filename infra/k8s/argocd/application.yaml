apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: astraguard
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sr-857/AstraGuard-AI-Apertre-3.0.git
    targetRevision: HEAD
    path: infra/helm/astraguard
  destination:
    server: https://kubernetes.default.svc
    namespace: astraguard
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
