"""
Pytest configuration for API testing

Configures:
- Test discovery
- Markers
- Fixtures scope
- Performance testing
- Coverage requirements
"""

import pytest
import sys
from pathlib import Path

# Add src directory to path
sys.path.insert(0, str(Path(__file__).parent.parent.parent / "src"))


def pytest_configure(config):
    """Configure pytest with custom markers."""
    config.addinivalue_line(
        "markers",
        "api: mark test as an API test"
    )
    config.addinivalue_line(
        "markers",
        "integration: mark test as an integration test"
    )
    config.addinivalue_line(
        "markers",
        "contract: mark test as an API contract test"
    )
    config.addinivalue_line(
        "markers",
        "benchmark: mark test as a performance benchmark"
    )
    config.addinivalue_line(
        "markers",
        "slow: mark test as slow-running"
    )


def pytest_collection_modifyitems(config, items):
    """Auto-mark tests based on file location."""
    for item in items:
        # Mark test based on file path
        if "contract" in item.nodeid:
            item.add_marker(pytest.mark.contract)
        if "benchmark" in item.nodeid or "performance" in item.nodeid:
            item.add_marker(pytest.mark.benchmark)
        if "integration" in item.nodeid:
            item.add_marker(pytest.mark.integration)
        if "api" in item.nodeid:
            item.add_marker(pytest.mark.api)
